name: wan-manager
short_description: "TR-181 compatible plugin for advanced WAN mode configuration"
long_description: ""

type: plugin
category: other

urls:
  opensource: "https://gitlab.com/prpl-foundation/components/core/plugins/wan-manager"

licenses:
  - name: "BSD-2-Clause-Patent"
    holder: "SoftAtHome"

configs:
  CONFIG_SAH_AMX_WAN_MANAGER:
    super: True
    default: y
    type: bool
    description: "Build a tr181 compatible time plugin"
  CONFIG_SAH_AMX_WAN_MANAGER_ORDER:
    depends: SAH_AMX_WAN_MANAGER
    default: 80
    type: int
    description: "WAN manager plugin start up order"
  CONFIG_SAH_AMX_WAN_MANAGER_RUN_AS_USER:
    depends_on:
      - CONFIG_SAH_AMX_WAN_MANAGER
    default: "tr181_app"
    type: string
    description: "User will be used for the WAN-MANAGER plugin"
  CONFIG_SAH_AMX_WAN_MANAGER_RUN_AS_GROUP:
    depends_on:
      - CONFIG_SAH_AMX_WAN_MANAGER
    default: "tr181_app"
    type: string
    description: "Group will be used for the WAN-MANAGER plugin"

makefiles:
  compile:
    - directory: "src"
    - directory: "scripts"
    - directory: "odl"
  clean:
    - directory: "src"
    - directory: "scripts"
    - directory: "odl"
    - directory: "test"
  test:
    - directory: "test"
      target: "run"
    - directory: "test"
      target: "coverage"

artifacts:
  - source: "odl/$(COMPONENT).odl"
    destination: "/etc/amx/$(COMPONENT)/$(COMPONENT).odl"
    permissions: "0644"
  - source: "odl/$(COMPONENT)_definition.odl"
    destination: "/etc/amx/$(COMPONENT)/$(COMPONENT)_definition.odl"
    permissions: "0644"
  - source: "odl/$(COMPONENT)_upc.odl"
    destination: "/etc/amx/$(COMPONENT)/$(COMPONENT)_upc.odl"
    permissions: "0644"
  - source: "odl/$(COMPONENT)_caps.odl"
    destination: "/etc/amx/$(COMPONENT)/$(COMPONENT)_caps.odl"
    permissions: "0644"
  - source: "odl/$(COMPONENT)_WAN_definition.odl"
    destination: "/etc/amx/$(COMPONENT)/$(COMPONENT)_WAN_definition.odl"
    permissions: "0644"
  - source: "odl/$(COMPONENT)_WAN_Intf_definition.odl"
    destination: "/etc/amx/$(COMPONENT)/$(COMPONENT)_WAN_Intf_definition.odl"
    permissions: "0644"
  - source: "odl/defaults.d/*"
    destination: "/etc/amx/$(COMPONENT)/defaults.d/"
    permissions: "0644"
  - source: "odl/$(COMPONENT)_mapping.odl"
    destination: "/etc/amx/tr181-device/extensions/01_device-x_prpl-com_wanmanager_mapping.odl"
    permissions: "0644"
  - source: "odl/extensions/*.odl"
    destination: "/etc/amx/$(COMPONENT)/extensions/"
    permissions: "0644"
  - source: "odl/amx-processmonitor/test-$(COMPONENT).odl"
    destination: "/etc/amx/amx-processmonitor/defaults.d/14-test-$(COMPONENT).odl"
    permissions: "0644"
  - source: "acl/admin/$(COMPONENT).json"
    destination: "$(ACLDIR)/admin/$(COMPONENT).json"
    permissions: "0660"
  - source: "acl/cwmp/$(COMPONENT).json"
    destination: "$(ACLDIR)/cwmp/$(COMPONENT).json"
    permissions: "0660"
  - source: "output/$(MACHINE)/$(COMPONENT).so"
    destination: "/usr/lib/amx/$(COMPONENT)/$(COMPONENT).so"
    permissions: "0755"
    version: False
  - source: "$(BINDIR)/amxrt"
    destination: "$(BINDIR)/$(COMPONENT)"
    symbolic: "True"
  - source: "scripts/$(COMPONENT).sh"
    destination: "$(INITDIR)/$(COMPONENT)"
    permissions: "0755"
    debug:
      order: $(CONFIG_SAH_AMX_WAN_MANAGER_ORDER)
    init:
      start: $(CONFIG_SAH_AMX_WAN_MANAGER_ORDER)
      stop: $(CONFIG_SAH_AMX_WAN_MANAGER_ORDER)

dependencies:
  compile:
    - name: "libamxc"
      min: "*"
    - name: "libamxp"
      min: "*"
    - name: "libamxd"
      min: "*"
    - name: "libamxb"
      min: "*"
    - name: "libamxm"
      min: "*"
    - name: "libamxo"
      min: "*"
    - name: "libamxj"
      min: "*"
    - name: "libsahtrace"
      min: "*"
    - name: "libnetmodel"
      min: "*"
    - name: "mod-dmext"
      min: "*"
    - name: "libipat"
      min: "*"

  runtime:
    - name: "libamxc"
    - name: "libamxp"
    - name: "libamxd"
    - name: "libamxb"
    - name: "libamxm"
    - name: "libamxo"
    - name: "libamxj"
    - name: "amxrt"
    - name: "libsahtrace"
    - name: "libnetmodel"
    - name: "mod-dmext"
    - name: "libipat"
    - name: "rpcd"

doc:
  parser: "amx"
  odl:
    - "odl/$(COMPONENT).odl"
